name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
      - feature/ui-overhaul

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://ci-build.invalid/uniwave_ci_no_db"
      AUTH_SECRET: "ci-build-synthetic-auth-secret-32-chars-long"
      AUTH_URL: "http://127.0.0.1:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify runtime
        run: |
          node --version
          npm --version
          test "$(node -p "process.versions.node.split('.')[0]")" = "24"
          test "$(npm config get engine-strict)" = "true"

      - name: Install dependencies
        run: npm ci

      - name: Validate dependency tree
        run: npm ls

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run test:e2e

      - name: Security audit policy
        run: npm run ci:security-audit

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
